      nobody was missed; I audited all 61 bare-global assignments in the script
      and confirmed every function reachable through a command substitution
      (redirect_launcher_entry, launcher_real_entry,
      resolve_anthropic_cc_runtime_entry, json_scalar_field,
      anthropic_cc_versions_root) declares every variable local, while
      load_targets/select_target/choose_target_interactive run in the current
      shell via process substitution so their global writes survive. The
      regression test really catches the bug's return: I reintroduced the exact
      round-1 shape (global CC_RESOLVE_REASON, reason read after the command
      substitution) in a /tmp copy and the new test failed with exit 1 at
      'successful resolution carries no reason', while the real copy passes with
      exit 0; the defective copy's --check also reproduced the forbidden 'cruce
      目标结构检查失败，已拒绝旧单文件写入路径' leak. All nine items verified with my own evidence,
      not the Builder's: my own broken/stale/healthy/single launcher fixtures in
      /tmp, the real dual-target machine for --check and the interactive picker,
      an independent 7-patch lifecycle plus smoke and restore-all on my own copy
      of the real 2.1.296 runtime tree, and an independent all-files hash of the
      three real installs before and after. The fast suite passes 19/19. Three
      risks recorded (tab-in-path parsing, explicit-path durability gap,
      pre-existing cometixcode/stale-baseline weakness); none of them is a
      failure of A1-A9, and the cometixcode failure was proven pre-existing by
      an identical run on a pristine HEAD extraction. Verdict: pass."
